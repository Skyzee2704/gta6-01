<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOLMAR 3D — Streets of Gold</title>
  <style>
    html, body { margin: 0; background: #0b1026; overflow: hidden; }
    canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; }
    canvas#view2d { position: fixed; inset: 0; display: none; width: 100%; height: 100%; }
    #loading { position: fixed; inset: 0; z-index: 90; display: grid; place-content: center;
      color: #f5ead2; background: #0b1026; font: 24px system-ui, sans-serif; text-align: center; }
    #fatal { position: fixed; inset: 0; z-index: 100; display: none; padding: 32px;
      background: #a00; color: white; font: 16px monospace; white-space: pre-wrap; overflow: auto; }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Solmar 3D game"></canvas>
  <canvas id="view2d" aria-label="Solmar top-down view"></canvas>
  <div id="loading">Loading Solmar... <span id="loadpct">0%</span></div>
  <div id="fatal" role="alert"></div>
  <script src="./vendor/three.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
